server {
    listen 80;
    server_name localhost;

    # Increase max body size for file uploads if needed in the future
    client_max_body_size 20M;

    location / {
        proxy_pass http://frontend:3000; # Assuming frontend service is named 'frontend' in docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket support for Next.js HMR (Hot Module Replacement)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ { # This will match /api/ and /api/v1/, etc.
        proxy_pass http://backend:8000; # Assuming backend service is named 'backend' in docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Strip /api prefix when forwarding to backend if backend routes don't include /api
        # For example, if backend has /v1/health, and nginx receives /api/v1/health
        # rewrite /api/(.*) /$1 break; # This strips /api
        # However, if backend routes are like /api/v1/items, then no rewrite is needed.
        # Based on current backend main.py, routes are / and /api/v1/health.
        # So if we want to access /api/v1/health via nginx at /api/v1/health,
        # the proxy_pass should go to http://backend:8000/api/v1...
        # Or backend should not have /api in its own routes.
        # For simplicity with current backend structure, let's assume backend routes might be / or /v1/..
        # And Nginx is responsible for the /api prefix.
        # So, if a request is /api/v1/health to Nginx, it should be proxied as /v1/health to backend.
        rewrite ^/api(/.*)$ $1 break; # This will strip /api prefix
                                     # e.g. /api/v1/health -> /v1/health
                                     # e.g. /api/docs -> /docs
                                     # If your backend FastAPI app has routes like app.get("/api/v1/...")
                                     # then you should remove this rewrite.
                                     # Given backend/app/main.py has @app.get("/api/v1/health"),
                                     # we should NOT rewrite here.
        # Removing rewrite based on current backend structure.
        # proxy_pass http://backend:8000; # This will forward /api/v1/health to http://backend:8000/api/v1/health
    }

    # You can add more location blocks here for other services or static assets.

    # Optional: Add gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
}
