<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - YuriODev Admin</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #f4f4f4; color: #333; }
        header { background-color: #333; color: white; padding: 1rem; text-align: center; }
        header h1 { margin: 0; }
        nav ul { list-style-type: none; padding: 0; background-color: #444; overflow: hidden; }
        nav ul li { float: left; }
        nav ul li a { display: block; color: white; text-align: center; padding: 14px 16px; text-decoration: none; }
        nav ul li a:hover { background-color: #555; }
        .container { padding: 1rem 2rem; max-width: 1000px; margin: 20px auto; background-color: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: #333; border-bottom: 1px solid #eee; padding-bottom: 0.5rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { border: 1px solid #ddd; padding: 0.75rem; text-align: left; }
        th { background-color: #f0f0f0; }
        .actions a { margin-right: 0.5rem; text-decoration: none; }
        .button, button[type="submit"] {
            background-color: #007bff; color: white; padding: 0.6rem 1rem; border: none;
            border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block;
            font-size: 0.95rem;
        }
        .button-secondary { background-color: #6c757d; }
        .button-danger { background-color: #dc3545; }
        .button:hover, button[type="submit"]:hover { opacity: 0.9; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.3rem; font-weight: bold; }
        .form-group input[type="text"], .form-group input[type="url"], .form-group input[type="number"], .form-group textarea, .form-group select {
            width: calc(100% - 1.2rem); padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px;
        }
        .form-group textarea { min-height: 100px; }
        .form-group input[type="checkbox"] { width: auto; margin-right: 0.5rem; vertical-align: middle; }
        .error { color: red; margin-bottom: 1rem; border: 1px solid red; padding: 0.5rem; border-radius: 4px; background-color: #ffe0e0;}
        .alert { padding: 1rem; margin-bottom: 1rem; border-radius: 4px; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        footer { text-align: center; padding: 1rem; margin-top: 2rem; font-size: 0.9rem; color: #777; }
    </style>
</head>
<body>
    <header>
        <h1>YuriODev Admin</h1>
    </header>
    <nav>
        <ul>
            <li><a href="{{ url_for('admin_dashboard') }}">Dashboard</a></li>
            <li><a href="{{ url_for('list_courses_admin') }}">Courses</a></li>
            <!-- Add other main sections here -->
            <li><a href="{{ url_for('logout') }}" style="float:right;">Logout</a></li> {# Assumes a /logout route exists #}
        </ul>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <footer>
        &copy; {{ now().year }} YuriODev Platform
    </footer>
</body>
</html>
